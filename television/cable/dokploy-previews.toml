# Dokploy preview deployments for the repo in the current directory.
#
# Entries are tab separated:
#   display <TAB> preview-url <TAB> pr-url <TAB> id <TAB> branch <TAB> pr-number
#   <TAB> dashboard-url
#
# dashboard and logs are deliberately keyless — reach them with ctrl-x.

# Deliberately NO `watch` here. Auto-reload sounds right for a stale-while-
# revalidate list, but a reload that lands while the ctrl-x picker is open makes
# tv resolve the action against the wrong row: in ActionPicker mode its
# selected_index() returns the *picker's* index and applies it to the results
# list. Measured over 8 runs of picking `dashboard` on row 2 — watch=0.3s got the
# wrong row 2 times, watch=off got it right every time. Silently opening another
# app's dashboard is worse than data that refreshes a beat later, so `list`
# serves the cache, revalidates in the background, and the fresh rows show up on
# the next open or on ctrl-r. The preview panel prints a "Fetched:" age so the
# staleness is never hidden.
# See `dokploy-previews --help` for the credentials it expects.

[metadata]
name = "dokploy-previews"
description = "Preview deployments on Dokploy for the current repo's git remote"
# workmux is deliberately not listed: it backs one optional action, and a hard
# requirement would make the whole channel unavailable without it.
requirements = ["dokploy-previews", "git", "jq", "curl"]

[source]
command = "dokploy-previews list"
display = "{split:\\t:0}"
output = "{split:\\t:1}"

[ui]
layout = "portrait"

[ui.preview_panel]
size = 55

[preview]
command = "dokploy-previews preview '{split:\\t:3}'"

[keybindings]
enter = "actions:open_preview"
ctrl-g = "actions:open_pr"
ctrl-y = "actions:copy_preview"
alt-y = "actions:copy_pr"
alt-w = "actions:workmux"
# Default ctrl-r would only re-read the cache; fetch first, then reload.
ctrl-r = ["actions:refresh", "reload_source"]

[actions.open_preview]
description = "Open the preview deployment in the browser"
command = "dokploy-previews open '{split:\\t:1}'"
mode = "fork"

[actions.open_pr]
description = "Open the pull request in the browser"
command = "dokploy-previews open '{split:\\t:2}'"
mode = "fork"

[actions.copy_preview]
description = "Copy the preview URL to the clipboard"
command = "dokploy-previews copy '{split:\\t:1}'"
mode = "fork"

[actions.copy_pr]
description = "Copy the pull request URL to the clipboard"
command = "dokploy-previews copy '{split:\\t:2}'"
mode = "fork"

# The PR-then-branch fallback lives in the script, not in a nu `try {} catch {}`
# here. tv only substitutes placeholders in an action command it can parse as a
# template, and a bare `{` starts a placeholder -- so nu's block braces made the
# whole string parse-fail and reach the shell verbatim: workmux got the literal
# `{split:\t:5}` as a PR number and then the literal `{split:\t:4}` as a branch
# name -- which is not even a legal git ref -- so alt-w could only ever fail.
# Keep this a flat command line. (Braces are only harmless in an action with no
# placeholders at all, which is why workmux.toml gets away with them.)
[actions.workmux]
description = "Open (or create) a workmux worktree for this PR"
command = "dokploy-previews workmux '{split:\\t:5}' '{split:\\t:4}'"
mode = "execute"

[actions.refresh]
description = "Fetch from Dokploy now, bypassing the cache"
command = "dokploy-previews refresh"
mode = "fork"

# No keybinding on purpose: both live in the ctrl-x action picker.
[actions.dashboard]
description = "Open this app's Dokploy dashboard (preview deployments tab)"
command = "dokploy-previews open '{split:\\t:6}'"
mode = "fork"

[actions.logs]
description = "Page the build log of this preview's latest deployment"
command = "dokploy-previews logs '{split:\\t:3}'"
mode = "fork"
