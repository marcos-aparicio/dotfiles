# Dokploy preview deployments for the repo in the current directory.
#
# Entries are tab separated:
#   display <TAB> preview-url <TAB> pr-url <TAB> id <TAB> branch <TAB> pr-number
# See `dokploy-previews --help` for the credentials it expects.

[metadata]
name = "dokploy-previews"
description = "Preview deployments on Dokploy for the current repo's git remote"
# workmux is deliberately not listed: it backs one optional action, and a hard
# requirement would make the whole channel unavailable without it.
requirements = ["dokploy-previews", "git", "jq", "curl"]

[source]
command = "dokploy-previews list"
display = "{split:\\t:0}"
output = "{split:\\t:1}"

[ui]
layout = "portrait"

[ui.preview_panel]
size = 55

[preview]
command = "dokploy-previews preview '{split:\\t:3}'"

[keybindings]
enter = "actions:open_preview"
ctrl-g = "actions:open_pr"
ctrl-y = "actions:copy_preview"
alt-y = "actions:copy_pr"
alt-w = "actions:workmux"

[actions.open_preview]
description = "Open the preview deployment in the browser"
command = "dokploy-previews open '{split:\\t:1}'"
mode = "fork"

[actions.open_pr]
description = "Open the pull request in the browser"
command = "dokploy-previews open '{split:\\t:2}'"
mode = "fork"

[actions.copy_preview]
description = "Copy the preview URL to the clipboard"
command = "dokploy-previews copy '{split:\\t:1}'"
mode = "fork"

[actions.copy_pr]
description = "Copy the pull request URL to the clipboard"
command = "dokploy-previews copy '{split:\\t:2}'"
mode = "fork"

# --pr is the accurate primitive here: it fetches the PR ref through gh, so it
# works for branches that live on a fork and were never fetched locally. -o
# makes it open an existing worktree instead of failing. The branch form is a
# fallback for when gh is unavailable or unauthenticated.
[actions.workmux]
description = "Open (or create) a workmux worktree for this PR"
command = "workmux add -o --pr '{split:\\t:5}' || workmux add -o '{split:\\t:4}'"
mode = "execute"
