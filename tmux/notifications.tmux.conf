# vim: ft=tmux
# Notification system. Bar segments live in plugins/catpuccin.tmux.conf next to
# the rest of status-format; this file owns the keys and the startup repush.

# Options are per-server and die with it -- and sh/switch_mode.sh runs
# `tmux kill-server`, so the badge would read empty after a mode switch while
# the inbox still held unread items. Recount from the file at startup.
run-shell -b "$HOME/.local/scripts/notify --refresh"
run-shell -b "$HOME/.local/scripts/notify-timer-ticker"

# Every lowercase prefix key is taken here, so these are shifted.
# n = work notes, w = tv workmux, t = task repo toggle all keep their meanings.

# N -- the inbox. Shifted sibling of n: notes, Notifications.
bind-key N display-popup -E -w 70% -h 50% -T " notifications " \
  "$HOME/.local/scripts/notify-popup"

# T -- set a reminder. Same command-prompt shape as prefix g (grab to inbox),
# so it types the same way.
bind-key T command-prompt -p "remind (20m | 14:30 | every 50m | daily 09:30):" \
  "run-shell '$HOME/.local/scripts/remind %1'"

# B -- bell me when the command already running in this pane finishes.
bind-key B run-shell "$HOME/.local/scripts/notify-attach '#{pane_id}'"
