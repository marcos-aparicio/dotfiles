# vim: ft=tmux
# Clickable staff-status segment. The segment itself is marked
# `range=user|shp` in plugins/catpuccin.tmux.conf; this file owns the click.
#
# MouseDown1Status already means "switch to the window I clicked", so this
# binding cannot simply replace it -- it tests the range and falls through.
# For a user range, #{mouse_status_range} holds the range's name; for the
# window list it holds the literal string `window`.
bind-key -T root MouseDown1Status \
  if-shell -F "#{==:#{mouse_status_range},shp}" \
    "display-menu -T '#[align=centre] staff status ' -x M -y S \
       'Signed in'       s 'run-shell -b \"$HOME/.local/scripts/shp-status set signed-in\"' \
       'Break'           b 'run-shell -b \"$HOME/.local/scripts/shp-status set break\"' \
       'Back from break' k 'run-shell -b \"$HOME/.local/scripts/shp-status set back\"' \
       '' \
       'End of the Day'  e 'run-shell -b \"$HOME/.local/scripts/shp-status set eod\"' \
       '' \
       'Refresh'         r 'run-shell -b \"$HOME/.local/scripts/shp-status fetch\"'" \
    "select-window -t ="

# The cache is written by shp-status and nothing else. Refresh it once at
# startup so the bar is not showing yesterday's state.
#
# It is NOT on a timer: the endpoint is called `update-self` and stamps
# `logged_time`, so polling it would report you as present every interval,
# including while you are away from the machine.
run-shell -b "$HOME/.local/scripts/shp-status fetch"
